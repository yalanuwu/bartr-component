<div class="min-h-screen flex items-center justify-center p-4 bg-gray-100 text-black">
  <img src="assets/gradient-2.png" alt="" class="fixed">
  <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 relative">
    <div class="text-center mb-6">
      <span class="font-konkhmer text-4xl font-extrabold text-gray-800 block mb-1">Welcome back!</span>
      <p class="text-base text-gray-600">Login to Share. Learn. Level Up</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="w-full max-w-sm mx-auto space-y-3">
      <div class="mb-4">
        <label for="email" class="sr-only">Email</label>
        <input type="text" id="email" [(ngModel)]="email" name="email" required
               placeholder="Email"
               class="w-full p-3 text-base border-2 border-gray-800 rounded-full focus:outline-none focus:border-green-600"/>
      </div>
      <div class="mb-4 relative">
        <label for="password" class="sr-only">Password</label>
        <input [type]="passwordVisible ? 'text' : 'password'" id="password" [(ngModel)]="password" name="password" required
               placeholder="Password"
               class="w-full p-3 text-base border-2 border-gray-800 rounded-full focus:outline-none focus:border-green-600 pr-10"/>
        <button type="button" (click)="togglePasswordVisibility()"
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-700 focus:outline-none">
          <svg *ngIf="passwordVisible" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
          </svg>

          <svg *ngIf="!passwordVisible" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
        </button>
      </div>

      <p *ngIf="errorMessage" class="text-red-600 text-sm text-center">{{ errorMessage }}</p>

      <button type="submit"
              class="w-full p-3 rounded-full text-base bg-black text-white cursor-pointer duration-300 hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition-transform hover:scale-105">
        Sign in
      </button>
    </form>

    <div class="my-6 text-center text-gray-500 relative">
      <span class="inline-block bg-white px-2 relative z-10">or continue with</span>
      <div class="absolute inset-x-0 top-1/2 h-px bg-gray-300 transform -translate-y-1/2"></div>
    </div>

    <div class="flex flex-col md:flex-row gap-4 w-full max-w-sm mx-auto mb-5">
      <button (click)="onGoogleLogin()"
              class="flex-1 flex flex-row gap-2 p-2 text-base border border-gray-300 rounded-full bg-white cursor-pointer transition-colors duration-300 items-center justify-center hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-green-700 focus:ring-offset-2">
        <img src="assets/icons/google.svg" alt="Google" class="h-6 w-6">Google
      </button>

      <button (click)="onTwitterLogin()"
              class="flex-1 flex flex-row gap-2 p-2 text-base border border-gray-300 rounded-full bg-white cursor-pointer transition-colors duration-300 items-center justify-center hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-green-700 focus:ring-offset-2">
        <img src="assets/icons/twitter-x.svg" alt="Twitter" class="h-6 w-6">Twitter
      </button>
    </div>

    <p class="text-sm text-center">
      Not a member? <a [routerLink]="['/auth/signup']" class="text-green-700 font-semibold cursor-pointer hover:underline">Register Now</a>
    </p>
  </div>
</div>
