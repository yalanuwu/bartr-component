<!-- src/app/not-found/not-found.component.html -->

<div class="flex items-center justify-center min-h-screen bg-gray-100 p-4">
  <div class="text-center bg-white p-8 md:p-12 rounded-xl shadow-lg border border-gray-200">
    <div class="flex flex-col items-center justify-center mb-8">
      <!-- You can use a fun SVG or an emoji here -->
      <svg class="w-24 h-24 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <h1 class="text-6xl md:text-8xl font-extrabold text-gray-800">404</h1>
      <p class="text-2xl md:text-3xl font-semibold text-gray-700 mt-4 mb-2">Page Not Found</p>
      <p class="text-gray-600 text-lg max-w-md">
        Oops! It looks like you've stumbled upon a page that doesn't exist.
      </p>
    </div>

    <button
      [routerLink]="['/']"
      class="mt-6 px-8 py-3 bg-green-600 text-white font-semibold rounded-full shadow-md
             hover:bg-green-700 transition-colors duration-300
             focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2"
    >
      Go Back Home
    </button>
  </div>
</div>
