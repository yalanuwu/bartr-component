<div class="flex-1 p-5 bg-white rounded-lg shadow-lg relative">
  <div
      class="absolute inset-0 z-0 bg-[radial-gradient(ellipse_at_bottom,_var(--tw-gradient-stops))] from-green-400/20 via-green-200/20 to-slate-200/60 backdrop-blur-xl"
    ></div>
    <h2 class="text-4xl font-semibold mb-1 text-gray-800 relative z-10">Courses Enrolled</h2>
    <!-- <button class="absolute top-6 right-5 bg-[#4CAF50] hover:bg-green-700 text-white py-2 px-4 rounded-full text-sm transition-colors duration-200" (click)="explore()">Explore</button> -->
    <p class="text-gray-600 text-sm mb-8 pb-2 border-b-2 border-gray-600 relative z-10">The courses you enrolled in</p>

    <button
      class="font-variable flex justify-center gap-2 items-center mx-auto text-sm text-gray-50 bg-[#4CAF50] backdrop-blur-md lg:font-variable isolation-auto before:absolute before:w-full before:transition-all before:duration-700 before:hover:w-full before:-left-full before:hover:left-0 before:rounded-full before:bg-[#FFFFFF] hover:text-black before:-z-10 before:aspect-square before:hover:scale-200 before:hover:duration-500 px-4 py-1 overflow-hidden border border-gray-900 rounded-full group absolute top-6 right-5 z-10"

      (click)="explore()"
    >
      Explore
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 16 19"
      class="w-8 h-8 justify-end bg-gray-50 group-hover:rotate-90 group-hover:bg-gray-50 text-gray-50   ease-linear duration-300 rounded-full border border-gray-700 group-hover:border-gray-700 p-2  rotate-45"
    >
    <path
      class="fill-gray-800 group-hover:fill-gray-800"
      d="M7 18C7 18.5523 7.44772 19 8 19C8.55228 19 9 18.5523 9 18H7ZM8.70711 0.292893C8.31658 -0.0976311 7.68342 -0.0976311 7.29289 0.292893L0.928932 6.65685C0.538408 7.04738 0.538408 7.68054 0.928932 8.07107C1.31946 8.46159 1.95262 8.46159 2.34315 8.07107L8 2.41421L13.6569 8.07107C14.0474 8.46159 14.6805 8.46159 15.0711 8.07107C15.4616 7.68054 15.4616 7.04738 15.0711 6.65685L8.70711 0.292893ZM9 18L9 1H7L7 18H9Z"
    ></path>
    </svg>
  </button>


    <!-- Grid to display course cards, responsive layout -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Loop through each course and render a CourseCardComponent -->
       @for (course of courses; track course.id) {

         <app-course-card-general  [course]="course" [showXP]="false" class="relative z-10 hover:shadow-lg"></app-course-card-general>
       }
    </div>

    <!-- Message if no courses are enrolled -->
     @if (courses.length === 0) {
      <div class="text-center text-gray-500 p-8 relative z-10">
        <p>You haven't enrolled in any courses yet.</p>
      </div>
     }

  </div>
