<!-- src/app/components/toastr/toastr.component.html -->

<!-- The toast container, conditionally rendered and styled -->
<div [ngClass]="toastClasses" *ngIf="currentToast">
  <div class="flex items-center justify-between p-4 rounded-lg shadow-xl min-w-[280px] max-w-sm">
    <!-- Icon (Optional: Add dynamic icons based on type) -->
    <div class="flex items-center">
      <svg *ngIf="currentToast.type === 'success'" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <svg *ngIf="currentToast.type === 'error'" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <!-- Message content -->
      <span class="text-base font-semibold">{{ currentToast.message }}</span>
    </div>

    <!-- Close button -->
    <button (click)="dismiss()" class="ml-4 text-white hover:text-gray-100 focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
</div>
