<!-- src/app/transaction-history/transaction-history.component.html -->

<div class="flex-1 p-5 bg-white rounded-lg shadow-lg relative">
  <div
      class="absolute inset-0 z-0 bg-[radial-gradient(ellipse_at_bottom,_var(--tw-gradient-stops))] from-green-400/20 via-green-200/20 to-slate-200/60 backdrop-blur-xl"
    ></div>
  <h1 class="text-4xl font-semibold mb-1 text-gray-800 relative z-10">Transaction History</h1>
  <p class="text-gray-600 text-sm mb-8 pb-2 border-b-2 border-gray-600 relative z-10">View your XP transaction details.</p>

  <button class="font-variable flex justify-center gap-2 items-center mx-auto text-sm text-gray-50 bg-[#4CAF50] backdrop-blur-md lg:font-variable isolation-auto before:absolute before:w-full before:transition-all before:duration-700 before:hover:w-full before:-left-full before:hover:left-0 before:rounded-full before:bg-[#FFFFFF] hover:text-black before:-z-10 before:aspect-square before:hover:scale-200 before:hover:duration-500 px-4 py-1 overflow-hidden border border-gray-900 rounded-full group absolute top-6 right-5 z-10" (click)="onPurchaseXP()">

    Purchase
    <div class="bg-white rounded-full p-2 border border-black">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="size-4"><g fill="none" stroke="black" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" ><path d="M16 13c-2.761 0-5-1.12-5-2.5S13.239 8 16 8s5 1.12 5 2.5s-2.239 2.5-5 2.5m-5 1.5c0 1.38 2.239 2.5 5 2.5s5-1.12 5-2.5m-18-5C3 10.88 5.239 12 8 12c1.126 0 2.165-.186 3-.5M3 13c0 1.38 2.239 2.5 5 2.5c1.126 0 2.164-.186 3-.5"/><path d="M3 5.5v11C3 17.88 5.239 19 8 19c1.126 0 2.164-.186 3-.5m2-10v-3m-2 5v8c0 1.38 2.239 2.5 5 2.5s5-1.12 5-2.5v-8"/><path d="M8 8C5.239 8 3 6.88 3 5.5S5.239 3 8 3s5 1.12 5 2.5S10.761 8 8 8"/></g></svg>
    </div>

  </button>


  <div class="overflow-x-auto relative z-10">
    <table class="min-w-full bg-white/80 border border-gray-200 rounded-lg shadow-sm fade-in-bottom-normal">
      <thead class="bg-gray-100 border-b border-gray-200">
        <tr>
          <th class="py-3 px-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider rounded-tl-lg">Sl No</th>
          <th class="py-3 px-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Course Name</th>
          <th class="py-3 px-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Type</th>
          <th class="py-3 px-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">XP</th>
          <th class="py-3 px-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider rounded-tr-lg">Date</th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngIf="transactions.length > 0; else noTransactions">
          <tr *ngFor="let transaction of transactions; let i = index"
              class="border-b border-gray-200 hover:bg-gray-50 transition-colors duration-150">
            <td class="py-3 px-4 text-sm text-gray-700">{{ i+1 }}</td>
            <td class="py-3 px-4 text-sm text-gray-800 font-medium">{{ transaction.course.title }}</td>
            <td class="py-3 px-4 text-sm font-semibold" [ngClass]="getTypeColor(transaction.type)">
              {{ transaction.type | titlecase }}
            </td>
            <td class="py-3 px-4 text-sm text-gray-700">{{ transaction.amount | number }}</td>
            <td class="py-3 px-4 text-sm text-gray-700">{{ transaction.transactedAt.substring(0,10)| date:'mediumDate' }}</td>
          </tr>
        </ng-container>
        <ng-template #noTransactions>
          <tr>
            <td colspan="5" class="py-8 text-center text-gray-500 text-lg">No transactions found.</td>
          </tr>
        </ng-template>
      </tbody>
    </table>
  </div>
</div>
