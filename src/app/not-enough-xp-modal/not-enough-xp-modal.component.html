<!-- src/app/not-enough-xp-modal/not-enough-xp-modal.component.html -->

<!-- Modal Overlay -->
<div class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 z-50 backdrop-blur-md animate-fade-in-backdrop"
     (click)="onBackdropClick($event)">

  <!-- Modal Content -->
  <div class="bg-white rounded-lg shadow-xl max-w-sm w-full p-6 relative transform scale-95 animate-fade-in"
       (click)="$event.stopPropagation()">

    <!-- Close Button -->
    <button (click)="close.emit()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>

    <div class="text-center mb-6">
      <svg class="mx-auto h-16 w-16 text-yellow-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
      </svg>
      <h2 class="text-2xl font-bold text-gray-800 mb-2">Not Enough XP!</h2>
      <p class="text-gray-600 text-sm">
        You need <span class="font-bold text-green-600">{{ requiredXp }} XP</span> for this action.
      </p>
      <p class="text-gray-600 text-sm">
        You currently have <span class="font-bold text-red-600">{{ availableXp }} XP</span>.
      </p>
    </div>

    <div class="flex flex-col space-y-4 mt-6">
      <button (click)="onEarnMoreXp()"
              class="w-full p-3 bg-green-600 text-white font-semibold rounded-full hover:bg-green-700 transition-colors duration-300">
        Earn More XP
      </button>
      <button (click)="close.emit()"
              class="w-full p-3 border border-gray-300 text-gray-700 font-semibold rounded-full hover:bg-gray-100 transition-colors duration-300">
        Maybe Later
      </button>
    </div>

  </div>
</div>

<!-- Basic CSS for animation (can go into not-enough-xp-modal.component.css) -->
<style>
/* Fade in for the modal content */
@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}
.animate-fade-in {
  animation: fadeIn 0.3s ease-out forwards;
}

/* Optional: subtle fade in for the backdrop itself */
@keyframes fadeInBackdrop {
  from { opacity: 0; }
  to { opacity: 1; }
}
.animate-fade-in-backdrop {
  animation: fadeInBackdrop 0.3s ease-out forwards;
}
</style>
