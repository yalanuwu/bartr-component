<div class="fixed inset-0 bg-transparent flex items-center justify-center p-4 z-50 backdrop-blur-sm"
     (click)="onBackdropClick($event)">

  <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-8 relative transform scale-95 animate-fade-in"
       (click)="$event.stopPropagation()">

    <button (click)="close.emit()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>

    <div class="text-center mb-8">
      <h2 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">Welcome back!</h2>
      <p class="text-gray-600 text-sm">Login to Share . Learn . Level Up</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-6">

      <div>
        <label for="email" class="sr-only">Email</label>
        <input type="email" id="email" name="email"
               [(ngModel)]="email" required
               placeholder="Email"
               class="w-full p-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-green-500 text-slate-800">
      </div>

      <div class="relative">
        <label for="password" class="sr-only">Password</label>
        <input [type]="passwordVisible ? 'text' : 'password'" id="password" name="password"
               [(ngModel)]="password" required
               placeholder="Password"
               class="w-full p-3 pr-10 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-green-500 text-slate-800">
        <button type="button" (click)="togglePasswordVisibility()"
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-700 focus:outline-none">


                <svg *ngIf="passwordVisible" class="h-3 w-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
                <svg *ngIf="!passwordVisible" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" >
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>

        </button>
      </div>

      <p *ngIf="errorMessage" class="text-red-600 text-sm text-center">{{ errorMessage }}</p>

      <button type="submit"
              class="w-full p-3 bg-black text-white font-semibold rounded-full hover:bg-gray-800 transition-colors">
        Login
      </button>

    </form>

    <div class="my-6 text-center text-gray-500 relative">
      <span class="inline-block bg-white px-2 relative z-10">or continue with</span>
      <div class="absolute inset-x-0 top-1/2 h-px bg-gray-300 transform -translate-y-1/2"></div>
    </div>

    <div class="flex flex-col space-y-3">
      <button (click)="onGoogleLogin()"
              class="w-full p-3 flex items-center justify-center border border-gray-300 rounded-full text-gray-700 font-semibold hover:bg-gray-50 transition-colors">
        <img src="assets/icons/google.svg" alt="Google" class="h-5 w-5 mr-2 mt-[1px]">
        Google
      </button>
      <button (click)="onTwitterLogin()"
              class="w-full p-3 flex items-center justify-center border border-gray-300 rounded-full text-gray-700 font-semibold hover:bg-gray-50 transition-colors">
        <img src="assets/icons/twitter-x.svg" alt="Twitter" class="h-5 w-5 mr-2 mt-[1px]">
        Twitter
      </button>
    </div>

    <div class="text-center mt-6 text-gray-600 text-sm">
      Not a member? <a (click)="onRegisterNow()" class="text-green-600 font-semibold cursor-pointer hover:underline">Register Now</a>
    </div>

  </div>
</div>

<style>
/* Basic fade in animation for modal */
@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}
.animate-fade-in {
  animation: fadeIn 0.3s ease-out forwards;
}
</style>
