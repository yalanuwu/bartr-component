<div class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 z-50 backdrop-blur-sm"
     (click)="onBackdropClick($event)">
  <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto transform scale-95 animate-fade-in"
       (click)="$event.stopPropagation()">
    <div class="p-6 md:p-8">
      <h2 class="text-3xl font-bold text-gray-800 mb-6 pb-4 border-b border-gray-200">Edit Profile</h2>

      <form (ngSubmit)="onSave()" class="space-y-6">

        <div>
          <label for="name" class="block text-gray-700 text-sm font-semibold mb-2">Name <span class="text-red-500">*</span></label>
          <input type="text" id="name" name="name"
                 [(ngModel)]="editedUser.name" required
                 placeholder="Your Full Name"
                 class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>

        <div>
          <label for="tagline" class="block text-gray-700 text-sm font-semibold mb-2">Tagline <span class="text-red-500">*</span></label>
          <input type="text" id="tagline" name="tagline"
                 [(ngModel)]="editedUser.tagline" required
                 placeholder="e.g., Full Stack Developer"
                 class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>

        <div>
          <label for="contact" class="block text-gray-700 text-sm font-semibold mb-2">Contact <span class="text-red-500">*</span></label>
          <input type="text" id="contact" name="contact"
                 [(ngModel)]="editedUser.contact" required
                 placeholder="e.g., your.email@example.com or +91 1234567890"
                 class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>

        <div>
          <label for="region" class="block text-gray-700 text-sm font-bold mb-2">Region</label>
          <select id="region" [(ngModel)]="editedUser.country" name="region"
                  class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
            <option value="" disabled>Select your Region</option> <option *ngFor="let region of regions" [value]="region">{{ region }}</option>
          </select>
        </div>

        <div>
          <label for="description" class="block text-gray-700 text-sm font-semibold mb-2">Bio <span class="text-red-500">*</span></label>
          <textarea id="description" name="description"
                    [(ngModel)]="editedUser.description" required rows="4"
                    placeholder="Tell us about yourself and your expertise."
                    class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500"></textarea>
        </div>

        <div>
          <label class="block text-gray-700 text-sm font-semibold mb-2">Skills</label>
          <div class="flex flex-wrap gap-2 mb-3">
            <span *ngFor="let skill of editedUser.skills; let i = index"
                  class="bg-green-100 text-green-800 text-sm px-3 py-1 rounded-full flex items-center">
              {{ skill }}
              <button (click)="removeSkill(i)" type="button" class="ml-2 text-green-600 hover:text-green-900 focus:outline-none">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
              </button>
            </span>
          </div>
          <div class="flex space-x-2">
            <input type="text" [(ngModel)]="newSkill" name="newSkill"
                   placeholder="Add a new skill"
                   class="flex-grow p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500"
                   (keydown.enter)="addSkill(); $event.preventDefault()">
            <button type="button" (click)="addSkill()"
                    class="px-4 py-2 bg-green-600 text-white rounded-md font-semibold hover:bg-green-700 transition-colors">
              Add
            </button>
          </div>
        </div>

        <div>
          <label for="responseTime" class="block text-gray-700 text-sm font-semibold mb-2">Average Response Time (in hours) <span class="text-red-500">*</span></label>
          <input type="number" id="responseTime" name="responseTime"
                 [(ngModel)]="editedUser.responseTime" required
                 placeholder="e.g., 2, 12, 24" min="0"
                 class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>

        <div class="pt-6 border-t border-gray-200 flex justify-end space-x-4">
          <button type="button" (click)="onCancel()"
                  class="px-6 py-3 bg-gray-200 text-gray-700 font-semibold rounded-md hover:bg-gray-300 transition-colors">
            Cancel
          </button>
          <button type="submit"
                  class="px-6 py-3 bg-green-600 text-white font-semibold rounded-md hover:bg-green-700 transition-colors">
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}
.animate-fade-in {
  animation: fadeIn 0.3s ease-out forwards;
}
</style>
